<!DOCTYPE html>
<html>
  <head>
    <title>WS Test</title>
  </head>
  <body>
    <h1>WebSocket Test</h1>
    <script>
      const socket = new WebSocket('ws://localhost:8080/ws');

      socket.onopen = () => {
        console.log('Connected');
        socket.send('Hello Server!');
      };

      socket.onmessage = (event) => {
        console.log('Received:', event.data);
      };
    </script>
  </body>
</html>
